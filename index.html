<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- Pre-apply dark mode to avoid flash: read localStorage early and set class before CSS renders -->
    <script>
      ;(function () {
        try {
          var v = localStorage.getItem('ark_dark')
          if (v === 'true') document.documentElement.classList.add('dark-mode')
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
    <title>ArkOJ</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
